version: 0.2

env:
  parameter-store:
    DOCKERHUB_USERNAME: /tara_backend/docker-credentials/username
    DOCKERHUB_PASSWORD: /tara_backend/docker-credentials/password
    SERVICES: /tara_backend/docker/service_name  # space-separated list of micr

phases:
  pre_build:
    commands:
      - echo "Logging in to DockerHub."
      - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
      - |
        echo "Getting Git commit hash..."
        export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
        echo "Commit hash tag: $IMAGE_TAG"
      - echo "Cleaning previous image_tag.txt..."

  build:
    commands:
      - |
        for SERVICE in $SERVICES; do
          echo "Building Docker image for $SERVICE..."
          # Pull latest image as cache if exists
          docker pull $DOCKERHUB_USERNAME/$SERVICE:latest || true
          # Build with cache
          docker build --cache-from $DOCKERHUB_USERNAME/$SERVICE:latest \
            -t $DOCKERHUB_USERNAME/$SERVICE:$IMAGE_TAG ./$SERVICE
          docker tag $DOCKERHUB_USERNAME/$SERVICE:$IMAGE_TAG $DOCKERHUB_USERNAME/$SERVICE:latest
        done

  post_build:
    commands:
      - |
        for SERVICE in $SERVICES; do
          IMAGE_FULL_NAME="$DOCKERHUB_USERNAME/$SERVICE:$IMAGE_TAG"
          echo "Pushing Docker image for $SERVICE..."
          docker push $IMAGE_FULL_NAME
          docker push $DOCKERHUB_USERNAME/$SERVICE:latest
          # Save in proper env format for docker-compose
          ENV_VAR_NAME=$(echo $SERVICE | tr 'a-z' 'A-Z')_IMAGE
          echo "$ENV_VAR_NAME=$IMAGE_FULL_NAME" >> image_tag.txt
        done
      - echo "Generated image_tag.txt:"
      - cat image_tag.txt

artifacts:
  files:
    - appspec.yml
    - scripts/*
    - image_tag.txt
    - docker-compose.yml
