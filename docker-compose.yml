services:
  payroll:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: payroll_service
    ports:
      - "8001:8000"
    restart: always
    command: >
      gunicorn Tara.wsgi:application --bind 0.0.0.0:8000
#    env_file:
#      - ../env/global.env
    networks:
      - micro_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/payroll/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5


networks:
  micro_net:
    external: true
